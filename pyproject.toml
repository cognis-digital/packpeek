[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packpeek-sarif"
version = "1.0.0"
description = "SARIF / YARA / Markdown companion for the packpeek static packer fingerprinter"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "COCL-1.0" }
authors = [{ name = "Cognis Digital" }]
keywords = ["malware", "triage", "packer", "entropy", "sarif", "yara"]
dependencies = []

[project.urls]
Homepage = "https://github.com/cognis-digital/packpeek"

[project.scripts]
packpeek-sarif = "sarif:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["sarif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
