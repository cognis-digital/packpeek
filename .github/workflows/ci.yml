name: ci
on: [push, pull_request]

env:
  PYTHONUTF8: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: gcc -O2 -std=c99 -Wall -Wextra -o packpeek packpeek.c -lm
      - name: packed sample (UPX markers + high entropy) -> exit 2
        run: |
          printf 'UPX0UPX1UPX!' > sample.bin
          head -c 8192 /dev/urandom >> sample.bin
          set +e
          out=$(./packpeek sample.bin); code=$?
          echo "$out"; echo "exit=$code"
          echo "$out" | grep -q '"verdict":"packed"' || { echo "expected packed"; exit 1; }
          echo "$out" | grep -q '"name":"UPX"' || { echo "expected UPX"; exit 1; }
          [ "$code" = "2" ] || { echo "expected exit 2"; exit 1; }
      - name: clean sample (low entropy, no markers) -> exit 0
        run: |
          yes A | head -c 8192 > clean.bin
          set +e
          out=$(./packpeek clean.bin); code=$?
          echo "$out"; echo "exit=$code"
          echo "$out" | grep -q '"verdict":"clean"' || { echo "expected clean"; exit 1; }
          [ "$code" = "0" ] || { echo "expected exit 0"; exit 1; }
      - name: SARIF + YARA companion
        run: |
          ./packpeek sample.bin | python sarif.py | python -c "import json,sys;json.load(sys.stdin)"
          ./packpeek sample.bin | python sarif.py --yara | grep -q 'rule packpeek_'
      - name: Markdown companion
        run: |
          ./packpeek sample.bin | python sarif.py --md | grep -q '## packpeek report'
      - name: CI gate (--fail-on)
        run: |
          set +e
          ./packpeek clean.bin | python sarif.py --fail-on packed; [ "$?" = "0" ] || { echo "clean should pass gate"; exit 1; }
          ./packpeek sample.bin | python sarif.py --fail-on packed; [ "$?" = "2" ] || { echo "packed should trip gate"; exit 1; }

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dev deps
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: run test suite (C core + Python companion)
        run: python -m pytest -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install linters
        run: python -m pip install --upgrade pip flake8
      - name: flake8 (syntax + undefined names)
        run: flake8 sarif.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
